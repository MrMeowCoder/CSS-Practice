<!DOCTYPE html>
<html>
    <head>
        <title>User Login</title>
        <link rel="stylesheet" href="/Nadakacheri login page/LoginPage/style.css">
        <script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>
    </head>
    <body>
        <header align="center">
            <img src="/Nadakacheri login page/nkKan.jpg" alt="nkKan" id="banner">
        </header>
        <main>
            <div id="form">
                <p id="welcome">Welcome to Nadakacheri</p>
                <div id="heading">
                    <!--Mobile number-->
                    <div class="mobileNo">
                        <p id="mobno">Mobile number</p>
                        <input type="text" id="mobnoin" placeholder="Mobile Number">
                        <div id="phoneico">&#128241;</div>
                    </div>

                    <!--OTP-->
                    <div class="otpno">
                        <p id="otpno">OTP</p>
                        <input type="text" id="otpin" placeholder="OTP">
                        <div id="otpic">🔐</div>
                    </div>

                    <img src="/Nadakacheri login page/GetCaptchaImage.png" alt="captcha" id="capcha">
                    <div id="refresh">
                        <img src="/Nadakacheri login page/refresh.png" alt="refresh" id="reficon">
                    </div>
                    <p>Enter Captcha</p>
                    
                    <input type="text" placeholder="Captchaa">
                    <p>OTP initiated. Pleas wait 20 seconds before requesting another OTP</p>
                    <button id="logn">Login</button>
                    <p>OTP will be sent to your regestered mobile number to login</p>
                </div>
            </div>
            <div id="one">div one</div>
        </main>
        <hr>
        <footer>
            <p id="copy">Copyright &copy; 2023, Design and developed by <a href="https://www.nic.gov.in/" id="nic">NIC</a> Release Date:28/05/2025</p>
        </footer>
    </body>
</html>
